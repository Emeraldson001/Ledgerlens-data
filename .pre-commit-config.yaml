repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]

  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml

  - repo: local
    hooks:
      - id: check-anonymization
        name: Check Anonymization
        entry: python scripts/check_anonymization.py
        language: python
        types_or: [json, csv, markdown, yaml, text]
        pass_filenames: false

      - id: check-import-cycles
        name: Check Import Cycles
        entry: python scripts/check_import_cycles.py --report-path .cache/import_cycle_report.json
        language: python
        types_or: [python]
        pass_filenames: false
