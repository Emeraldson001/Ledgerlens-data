tenants:
  exchange_a:
    risk_threshold: 70
    threshold_strategy: static
    threshold_config: {}
    benford_min_sample: 100
    alert_channels:
      - stdout
    asset_pair_whitelist:
      - USDC:GA5ZSEJYBY3RJRC5AVCIA5MOP4RHTM335X2KGX3IHOJAPP5RE34K4KZVN
    # Per-tenant rate limit overrides (issue #922).
    # These are enforced by the tenant-scoped limiter in api/app.py, in
    # addition to any global rate limit. Omit this block to inherit the
    # global defaults (rate_limit_defaults below).
    rate_limit:
      # Sustained request rate allowed for this tenant, in requests/second.
      rate_per_second: 50
      # Maximum burst size (token bucket capacity).
      burst: 100
  exchange_b:
    risk_threshold: 75
    threshold_strategy: statistical
    threshold_config:
      recall_floor: 0.85
      target_metric: f1
    benford_min_sample: 50
    alert_channels:
      - webhook
    asset_pair_whitelist:
      - USDC:GA5ZSEJYBY3RJRC5AVCIA5MOP4RHTM335X2KGX3IHOJAPP5RE34K4KZVN
    # Per-tenant rate limit overrides (issue #922).
    rate_limit:
      rate_per_second: 25
      burst: 50

# Default per-tenant rate limits applied when a tenant does not define its
# own `rate_limit` block. The tenant-scoped limiter in api/app.py keys its
# token buckets on the authenticated tenant identity, so each tenant gets
# an isolated bucket and one tenant's traffic cannot consume another's
# capacity. See api/app.py for the enforcement and metrics wiring.
rate_limit_defaults:
  rate_per_second: 20
  burst: 40
