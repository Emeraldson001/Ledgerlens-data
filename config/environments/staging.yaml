# Staging environment configuration
# REQUIRED: DATABASE_URL must be set to a PostgreSQL connection string
# RECOMMENDED: Use a separate PostgreSQL instance from production
# FAIL CLOSED: Missing this file in staging mode causes startup failure

database:
  # Staging: PostgreSQL (production-like, but separate instance)
  # Example: postgresql://user:pass@staging-rds.us-east-1.rds.amazonaws.com:5432/ledgerlens_staging
  url: "${DATABASE_URL}"
  pool_size: 15
  max_overflow: 20
  pool_timeout: 30
  require_tls: true

logging:
  format: "json"
  level: "INFO"

feature_drift:
  window_size: 1000

alerts:
  dedup_window_seconds: 60

risk_scoring:
  flag_threshold: 70

models:
  directory: "/var/lib/ledgerlens/models"
  batch_scorer_workers: 15

# Staging has most prod security, but allows additional debugging
security:
  enable_query_audit: true
  enable_backup_verification: true
  require_backup_before_migration: true

observability:
  metrics_enabled: true
  trace_sampling_rate: 0.5  # Higher sampling than prod for better diagnostics
  health_check_interval_seconds: 30
